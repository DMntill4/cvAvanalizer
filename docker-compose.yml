services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-streamlit-dev
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-langchain_user}:${POSTGRES_PASSWORD:-langchain_password}@postgres:5432/${POSTGRES_DB:-langchain_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin:
        condition: service_started
    command: sleep infinity
    networks:
      - postgres_network

  postgres:
    image: postgres:16
    container_name: langchain-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langchain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langchain_password}
      POSTGRES_DB: ${POSTGRES_DB:-langchain_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_langchain_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: langchain-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_dev_password}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_network

configs:
  pgadmin_servers:
    content: ${PGADMIN_SERVERS_JSON:-'{"Servers":{"1":{"Name":"Local PostgreSQL","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"langchain_db","Username":"langchain_user","SSLMode":"prefer"}}}'}

volumes:
  postgres_langchain_data:
  pgadmin_data:

networks:
  postgres_network:
    driver: bridge
